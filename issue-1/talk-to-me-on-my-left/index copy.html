<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Talk to me on My Left</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <script src="../../assets/js/color-theme.js" defer></script>
    <script src="../../assets/js/intro-content.js" defer></script>
    <script src="../../assets/js/script.js" defer></script>
  </head>
  <body>
    <img class="image-cursor" src="" alt="">
    <div id="pigeon-layer" aria-hidden="true"></div>

    <!-- 顶部信息区 -->
    <header>

      <section class="intro desktop">
        <div class="intro-mobile hidden-on-desktop"></div>
        <div class="intro-cn hidden-on-mobile"></div>
        <div class="intro-en hidden-on-mobile"></div>
        <div class="intro-meta"></div>
      </section>

      <section class="work-meta">
        <div class="work-label">work info&ensp;<span class="dot"></span></div>
        <div class="work-details">
          <div>
            <p>作品名称</p>
            <p>Talk to me on My Left</p>
          </div>
          <div>
            <p>作者名称</p>
            <p>Yuanbo</p>
          </div>
          <div>
            <p>作者简介</p>
            <p>最近在阅读和写作一些和本职工作无关的文字。</p>
          </div>
          <div>
            <p>年份</p>
            <p>2021</p>
          </div>
          <div>
            <p>材料</p>
            <p>925银</p>
          </div>
          <div>
            <p>尺寸</p>
            <p>7.3 * 1.2 CM，5.14 G</p>
          </div>
          <div>
            <p>版数</p>
            <p>80</p>
          </div>
        </div>
      </section>

    </header>

    <main class="work-content">
      
      <div class="hidden-on-mobile"></div>
      
      <div>
        <section class="article article-cn">
          <p>
            2020年一月，我开始耳鸣。起初做了不少检查，但因为疫情的原因，错过了最佳的治疗时期，于是左耳里至今都持续地回响着金属摩擦的窸窣声。从刚开始的难以忍受，到逐渐习惯了耳鸣，直至感到自己慢慢失去了左侧的敏感，我有了一个强烈的愿望<span class="cn">——</span>让左耳听到外部的声音<span class="cn">——</span>哪怕是更大的噪音。
          </p>
          <p>
            我做了一个耳环，挂满铃铛，铃铃铃，铃铃铃<span class="cn">……</span>
          </p>
        </section>

        <section class="article article-en hidden"></section>

        <figure class="image">
          <img src="images/1.jpg" alt="">
        </figure>
        <figure class="image">
          <img src="images/2.jpg" alt="">
        </figure>
        <figure class="image">
          <img src="images/3.jpg" alt="">
        </figure>
        <figure class="image">
          <img src="images/4.jpg" alt="">
        </figure>
        <figure class="image">
          <img src="images/5.jpg" alt="">
        </figure>
        <figure class="image">
          <video controls autoplay>
            <source src="images/6.mp4" type="video/mp4" />
          </video>
        </figure>

      </div>
      
      <div class="hidden-on-mobile"></div>
      
    </main>
