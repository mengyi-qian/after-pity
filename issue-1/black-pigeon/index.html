<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title></title>
    <link rel="preload" href="assets/fonts/ChillKai_AfterPity_HF1500_Site.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/IBMDokument-Regular.otf" as="font" type="font/opentype" crossorigin>
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/pigeon-black.svg">
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <script src="content.js" defer></script>
    <script src="../../assets/js/color-theme.js" defer></script>
    <script src="../../assets/js/intro-content.js" defer></script>
    <script src="../../assets/js/script.js" defer></script>
  </head>
  <body>
    <img class="image-cursor" src="" alt="">
    <div id="pigeon-layer" aria-hidden="true"></div>

    <!-- 顶部信息区 -->
    <header>

      <section class="intro desktop">
        <div class="intro-mobile hidden-on-desktop"></div>
        <div class="intro-cn hidden-on-mobile"></div>
        <div class="intro-en hidden-on-mobile"></div>
        <div class="intro-meta"></div>
      </section>

      <section class="work-meta">
        <div class="work-label"><a href="#">work info</a>&ensp;<span class="dot"></span></div>
        <div class="work-details">
          <div><p>作品名称</p><p id="work-title"></p></div>
          <div><p>作者名称</p><p id="author-name"></p></div>
          <div><p>作者简介</p><p id="author-intro"></p></div>
          <div><p>年份</p><p id="work-year"></p></div>
          <div><p>材料</p><p id="work-material"></p></div>
          <div><p>尺寸</p><p id="work-size"></p></div>
          <div><p>版数</p><p id="work-edition"></p></div>
        </div>
      </section>

    </header>

    <!-- 作品简介及图片 -->
    <main class="work-content">
      <div class="hidden-on-mobile"></div>
      <div id="work-body"></div>
      <div class="hidden-on-mobile"></div>
    </main>

  </body>
</html>
