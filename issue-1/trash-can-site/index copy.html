        <section class="article article-cn">
          <p>
            清空垃圾桶是每天关上电脑前最后的仪式。我们视不再需要的东西为垃圾，并迫不及待地希望它们从眼前消失。垃圾桶是系统里唯一拥有两种形态的拟物图标，我们将文件拖拽到垃圾桶中，随着一声撞击金属的声响，曾经的文件变成了垃圾桶里的纸团，再随着一声碎纸的声效，它们永远的消失了<span class="cn">……</span>吗？
          </p>
          <p>
            我做了一个网站，里面放置着一个垃圾桶，它小到只能容纳一个文件。
          </p>
